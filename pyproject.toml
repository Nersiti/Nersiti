[project]
name = "nersiti-ai-bot"
version = "1.0.0"
description = "Telegram AI bot (chat + image generation) monetized with Telegram Stars and YooKassa"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
