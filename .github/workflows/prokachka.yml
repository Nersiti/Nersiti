name: Прокачка

on:
  push:
    paths:
      - "prokachka/**"
      - ".github/workflows/prokachka.yml"
  pull_request:
    paths:
      - "prokachka/**"
      - ".github/workflows/prokachka.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prokachka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты ядра
        run: ./gradlew -p core test

      - name: Сборка APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: prokachka-debug-apk
          path: prokachka/app/build/outputs/apk/debug/*.apk
